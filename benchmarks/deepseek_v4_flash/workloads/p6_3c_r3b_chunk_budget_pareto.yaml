schema_version: 1
workload_id: p6_3c_r3b_chunk_budget_pareto
task_id: p6_3c_r3b_chunk_budget_pareto_2026_0804_run01
date: "2026-08-04"
stage: P6.3C-R3B
title: Chunked Prefill chunk-budget calibrated policy Pareto comparison

research_question:
  - >-
    Given that R3A B=12288 removed long-Prefill admission starvation but caused
    severe resident Decode tail stalls, can a smaller On-side scheduler token
    budget preserve useful injected-request TTFT benefit while reducing Decode
    interference and throughput loss?
  - >-
    Which tested policies are non-dominated across injected TTFT, resident P99
    TBT, maximum token stall, aggregate output throughput, and TBT SLO
    attainment?

lineage:
  original_reference_audit:
    configuration: max_model_len_135168,max_num_batched_tokens_4096,max_num_seqs_1
    outcome: blocked_p6_3c_not_strict_single_variable
    overwritten: false
  controlled_prefill_mechanism:
    task_id: p6_3c_r2_f4_request_id_normalized_atomic_coarrival_2026_0731_run01
    outcome: accepted_chunked_prefill_scheduler_mechanism_observed
    overwritten: false
  decode_resident_parent:
    task_id: p6_3c_r3a_decode_resident_admission_cliff_2026_0803_run01
    outcome: mechanism_confirmed_tradeoff_only
    key_effects:
      injected_ttft_relative_change_on_vs_off: -0.777245
      resident_p99_tbt_relative_change_on_vs_off: 6.842759
      aggregate_output_tps_relative_change_on_vs_off: -0.084553
    overwritten: false
  new_variant_reason: >-
    R3A used a nearly full 12272-token first chunk. R3B intentionally changes
    On-side max_num_batched_tokens to calibrate the policy trade-off. It is an
    independently named policy comparison, not the unchanged R3A A/B.

fixed_platform_contract:
  model: /data/node0_disk1/Public/DeepSeek-V4-Flash-w8a8-mtp
  served_model_name: deepseek-v4-flash-w8a8-mtp
  quantization: ascend_w8a8
  vllm: 0.22.1+empty
  vllm_ascend: 0.22.1rc1
  tensor_parallel_size: 8
  expert_parallel: true
  mtp_num_speculative_tokens: 1
  graph_mode: FULL_DECODE_ONLY
  block_size: 128
  async_scheduling: true
  enable_prefix_caching: false
  max_model_len: 12288
  max_num_seqs: 9
  profiler: disabled
  request_retry_count: 0

policy_configs:
  - config_id: off_b12288
    enable_chunked_prefill: false
    max_num_batched_tokens: 12288
    role: legal_off_baseline
  - config_id: on_b2048
    enable_chunked_prefill: true
    max_num_batched_tokens: 2048
  - config_id: on_b4096
    enable_chunked_prefill: true
    max_num_batched_tokens: 4096
  - config_id: on_b6144
    enable_chunked_prefill: true
    max_num_batched_tokens: 6144
  - config_id: on_b8192
    enable_chunked_prefill: true
    max_num_batched_tokens: 8192
  - config_id: on_b12288
    enable_chunked_prefill: true
    max_num_batched_tokens: 12288
    role: r3a_policy_anchor

comparison_semantics:
  strict_single_variable_ab: false
  reason: >-
    Off requires B >= max_model_len and therefore remains at B=12288. The On
    configs intentionally change both Chunked Prefill state and token budget
    relative to Off. R3B estimates complete-policy trade-offs rather than the
    causal effect of one boolean.
  causal_anchor: >-
    R3A remains the strict matched A/B evidence for enabling Chunked Prefill at
    B=12288. R3B must not overwrite or relabel it.

staged_arrival:
  resident_cohort:
    request_count: 8
    prompt_tokens_each: 256
    forced_output_tokens_each: 128
    transport: one_batched_streaming_http_request
  injection_gate:
    condition: all_8_residents_streamed_at_least_16_output_tokens
    client_clock: monotonic_ns
  injected_request:
    prompt_tokens: 12281
    forced_output_tokens: 4
    transport: independent_streaming_http_request
  cells:
    - cell_id: resident_only
      role: decode_baseline_for_each_policy
    - cell_id: admission_cliff_12281
      role: prefill_decode_interference_tradeoff
  token_timing:
    retain_generated_text: false
    retain_generated_token_ids: false
    retain_token_arrival_monotonic_timestamps_server_local: true

mechanism_calibration:
  configs: [on_b2048, on_b4096, on_b6144, on_b8192, on_b12288]
  lifecycle_count: 5
  cell: admission_cliff_12281
  repeats_per_config: 1
  observer: read_only_returns_original_scheduler_output
  required_before_performance: true
  pass_conditions:
    - exactly eight resident requests are running at the first injected step
    - resident Decode scheduled-token total D is positive
    - trace token budget equals the policy max_num_batched_tokens
    - first injected chunk equals min(12281, budget-D)
    - the first injected chunk is partial and mixed with resident Decode
    - observed Prefill chunks sum to exactly 12281 tokens
    - no preemption occurs
  failure_action: >-
    Stop before performance and retain the affected budget trace. Repair
    observation or control-plane issues when scientific variables are
    unchanged; create a new variant for workload or policy changes.

performance_track:
  observer: disabled
  profiler: disabled
  lifecycle_count: 12
  mirror_order:
    round_1: [off_b12288, on_b2048, on_b4096, on_b6144, on_b8192, on_b12288]
    round_2: [on_b12288, on_b8192, on_b6144, on_b4096, on_b2048, off_b12288]
  valid_trials_per_config_cell: 12
  valid_trials_per_cell_per_lifecycle: 6
  cell_sequence_per_lifecycle:
    - resident_only
    - admission_cliff_12281
    - admission_cliff_12281
    - resident_only
    - resident_only
    - admission_cliff_12281
    - admission_cliff_12281
    - resident_only
    - resident_only
    - admission_cliff_12281
    - admission_cliff_12281
    - resident_only

primary_objectives:
  minimize:
    - injected_request_ttft_ms
    - resident_interference_tbt_p99_ms
    - resident_interference_max_adjacent_token_stall_ms
  maximize:
    - aggregate_output_tokens_per_second
    - resident_tbt_slo_attainment
  resident_tbt_slo:
    threshold: 2x_off_b12288_resident_only_pooled_median_tbt
    status: project_analysis_threshold_not_external_standard

paired_analysis:
  pairing: >-
    For each On config, pair repeat index with the contemporaneous Off baseline
    in the same ascending or descending mirror round.
  uncertainty:
    method: paired_bootstrap_median_difference
    samples: 10000
    confidence_interval: 95_percent
    random_seed: 633
    caveat: >-
      Six trials share a fresh-model lifecycle. Report each mirror-round median
      alongside the trial-pair interval; do not claim independent replicates.

decision_rules:
  pareto_frontier:
    include_off_baseline: true
    dominance: no_worse_on_all_objectives_and_strictly_better_on_at_least_one
  deployment_bounds_relative_to_off:
    injected_ttft: reduction_at_least_20_percent
    resident_interference_p99_tbt: increase_at_most_10_percent
    aggregate_output_tps: decrease_at_most_5_percent
  outcomes:
    - pareto_candidate_found_within_preregistered_bounds
    - pareto_frontier_observed_no_candidate_within_bounds
    - chunk_budget_mechanism_incomplete
    - chunk_budget_performance_incomplete
  next_stage: >-
    Do not automatically select R3C configs. Development-machine review must
    inspect effect sizes, mirror-round consistency, chunk counts, and resource
    evidence before authorizing natural-traffic work.

expected_execution:
  model_lifecycles: 17
  mechanism_lifecycles: 5
  performance_lifecycles: 12
  engine_requests_including_warmup: 1286
  local_http_requests_including_warmup: 243
  retries: 0

claim_boundary:
  supported_if_complete: >-
    Controlled decode-resident admission-cliff policy calibration across the
    six named configurations on the pinned Ascend/vLLM stack.
  unsupported:
    - strict single-variable attribution for the R3B Off-versus-small-budget comparisons
    - natural API arrival behavior
    - production SLO capacity
    - universal Chunked Prefill benefit
    - automatic selection of an R3C deployment candidate

adaptive_execution:
  policy: docs/SERVER_ADAPTIVE_EXECUTION_POLICY.md
  task_local_repairs_allowed: true
  evidence_required:
    - before_after_diff_and_sha256
    - attempt_history
    - scientific_impact_statement
    - resource_recovery_evidence
  new_variant_required_if_changed:
    - policy_config_set
    - max_model_len
    - max_num_seqs
    - resident_request_set
    - injection_gate
    - injected_prompt_tokens
    - output_lengths
    - cell_set
    - sample_count
    - metric_definition

result_transfer_authorized: true
transfer_method_selected: false
automatic_transfer_allowed: false
