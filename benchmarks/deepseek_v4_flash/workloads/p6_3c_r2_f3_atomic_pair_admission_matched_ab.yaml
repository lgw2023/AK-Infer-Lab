research_question:
  - Does Chunked Prefill change scheduler behavior when two requests are
    deterministically visible to the same first Scheduler.schedule call and
    their total prefill exceeds the jointly frozen token budget?
  - Under that controlled co-arrival environment, what descriptive changes
    appear in short-request TTFT, per-request latency, completion balance, and
    batch throughput?

